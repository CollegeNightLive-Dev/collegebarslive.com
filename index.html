<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>The Live Feed | Predict Your Night</title>
    <style>
        :root {
            --bg-black: #000000;
            --text-main: #ffffff;
            --text-dim: #636366;
            --footer-text: #424245;
            --accent-gray: #1c1c1e;
            --iu-crimson: #990000; /* New branding color for search match */
        }

        html, body {
            height: 100%;
            margin: 0;
            background-color: var(--bg-black);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        body {
            display: flex;
            flex-direction: column;
            box-sizing: border-box;
            padding: 0 24px;
            text-align: center;
        }

        .main-wrapper {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            width: 100%;
            animation: fadeIn 0.8s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .main-content {
            width: 100%;
            max-width: 600px;
        }

        h1 {
            font-size: clamp(44px, 10vw, 78px);
            font-weight: 900;
            letter-spacing: -0.02em;
            margin: 0 0 16px 0;
            line-height: 0.95;
            text-transform: uppercase;
        }

        .hero-desc {
            font-size: 17px;
            color: #86868b;
            line-height: 1.4;
            margin-bottom: 40px;
            max-width: 450px;
            margin-left: auto;
            margin-right: auto;
        }

        .search-container {
            width: 100%;
            max-width: 480px;
            margin: 0 auto 50px;
        }

        input[type="text"] {
            width: 100%;
            padding: 18px 24px;
            background: var(--accent-gray);
            border: 1px solid #2c2c2e;
            border-radius: 14px;
            color: white;
            font-size: 17px;
            outline: none;
            box-sizing: border-box;
            transition: border-color 0.3s, box-shadow 0.3s;
        }

        input[type="text"]:focus {
            border-color: #444;
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.05);
        }

        /* Coming Soon Section */
        .coming-soon-header {
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 0.25em;
            color: var(--text-dim);
            text-transform: uppercase;
            margin-bottom: 18px;
        }

        .features-grid {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
        }

        .feature-item {
            font-size: 10px;
            color: var(--footer-text);
            display: flex;
            align-items: center;
            gap: 6px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .dot {
            height: 3px;
            width: 3px;
            background-color: var(--footer-text);
            border-radius: 50%;
        }

        footer {
            padding-bottom: 40px;
        }

        .copyright {
            font-size: 10px;
            color: var(--footer-text);
            letter-spacing: 0.02em;
        }

        @media (max-width: 600px) {
            h1 { font-size: 52px; }
            .search-container { margin-bottom: 40px; }
        }
    </style>
</head>
<body>

    <div class="main-wrapper">
        <div class="main-content">
            <h1>THE LIVE<br>FEED</h1>
            <p class="hero-desc">Self-learning AI model predicting live campus bar and food joint wait times.</p>

            <div class="search-container">
                <input type="text" id="schoolSearch" placeholder="Search for a school (e.g. Purdue)..." onkeypress="handleSearch(event)">
            </div>

            <div class="coming-soon-section">
                <div class="coming-soon-header">LIVE NOTIFICATIONS - COMING SOON TO APP STORE</div>
                <div class="features-grid">
                    <div class="feature-item"><span class="dot"></span> "SECURITY (UC)"</div>
                    <div class="feature-item"><span class="dot"></span> MUSIC VIBE</div>
                    <div class="feature-item"><span class="dot"></span> SPECIAL GUESTS</div>
                </div>
            </div>
        </div>
    </div>

    <footer>
        <div class="copyright">
            © 2026 Srikar Konda & Jackson Stevenson. All rights reserved.
        </div>
    </footer>

    <script>
        /**
         * Resolves search queries to the universal template with specific uniId params.
         * This architecture allows for 100% scalability without creating new .html files.
         */
        function handleSearch(event) {
            if (event.key === "Enter") {
                const query = document.getElementById('schoolSearch').value.toLowerCase().trim();
                
                // Redirect logic using URL parameters for the dynamic template
                if (query.includes('ohio state') || query === 'osu') {
                    window.location.href = 'university.html?uni=ohio-state';
                } 
                else if (query.includes('purdue')) {
                    window.location.href = 'university.html?uni=purdue';
                }
                else if (query.includes('miami')) {
                    window.location.href = 'university.html?uni=miami-oh';
                }
                else if (query.includes('cincinnati') || query === 'uc') {
                    window.location.href = 'university.html?uni=cincinnati';
                }
                else if (query.includes('ohio university') || query === 'ou' || query === 'ohio') {
                    window.location.href = 'university.html?uni=ohio-university';
                }
                // Default fallback
                else {
                    alert("School not found. We are currently live at OSU, Miami, Cincinnati, Purdue, and OU!");
                }
            }
        }
    </script>
</body>
</html>
