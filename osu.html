<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>OSU Intel Feed | The Refinery</title>
    <style>
        /* Ultra-Minimalist Apple Dark UI - No changes to look [cite: 2026-01-25] */
        :root {
            --bg-black: #000000;
            --border-gray: #1c1c1e;
            --text-main: #ffffff;
            --text-dim: #636366;
            --footer-text: #424245;
            --wait-green: #30d158;
            --wait-yellow: #ffd60a;
            --wait-red: #ff453a;
            --vouch-border: #2c2c2e;
        }

        body {
            background-color: var(--bg-black);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif;
            margin: 0;
            padding: 0;
            -webkit-font-smoothing: antialiased;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            overflow-x: hidden;
            animation: fadeIn 0.5s ease-out forwards;
            opacity: 0;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        header {
            text-align: center;
            padding: 80px 32px 40px;
        }

        header h1 {
            font-size: 28px;
            font-weight: 800;
            letter-spacing: 2px;
            margin: 0;
            text-transform: uppercase;
        }

        header p {
            font-size: 11px;
            color: var(--text-dim);
            margin-top: 10px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            line-height: 1.5;
        }

        .dashboard-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            padding: 0 32px 120px;
            box-sizing: border-box;
            flex: 1;
        }

        .column {
            width: 100%;
            max-width: 500px;
            margin-bottom: 60px;
        }

        .column-header h2 {
            font-size: 10px;
            font-weight: 600;
            color: var(--text-dim);
            text-transform: uppercase;
            letter-spacing: 0.2em;
            margin-bottom: 24px;
            padding-bottom: 12px;
            border-bottom: 1px solid var(--border-gray);
        }

        .row-item {
            margin-bottom: 40px;
            width: 100%;
        }

        .row-top {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 12px;
        }

        .venue-info {
            display: flex;
            flex-direction: column;
        }

        .venue-name {
            font-size: 17px;
            font-weight: 500;
            letter-spacing: -0.02em;
        }

        .verified-reports {
            font-size: 9px;
            color: var(--text-dim);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-top: 2px;
        }

        .wait-time-text {
            font-size: 14px;
            font-weight: 600;
        }

        .bar-container {
            width: 100%;
            height: 3px;
            background-color: var(--border-gray);
            border-radius: 2px;
            overflow: hidden;
            margin-bottom: 18px;
        }

        .bar-fill {
            height: 100%;
            transition: width 1s cubic-bezier(0.2, 1, 0.2, 1), background-color 0.5s ease;
        }

        .vouch-section {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .vouch-btn {
            background: transparent;
            color: var(--text-main);
            border: 1px solid var(--vouch-border);
            padding: 4px 12px;
            border-radius: 6px;
            font-size: 9px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            cursor: pointer;
            transition: background 0.2s;
        }

        .vouch-btn:active { background: var(--border-gray); }

        .intel-options { display: flex; gap: 14px; }

        .intel-options button {
            background: transparent;
            color: var(--text-dim);
            border: none;
            padding: 0;
            font-size: 10px;
            font-weight: 600;
            cursor: pointer;
            transition: color 0.2s ease;
        }

        .intel-options button:hover { color: var(--text-main); }

        .footer {
            width: 100%;
            text-align: center;
            padding: 0 32px 40px;
            font-size: 0.7rem;
            color: var(--footer-text);
            box-sizing: border-box;
        }
        .footer a { color: var(--footer-text); text-decoration: none; }

        @media (min-width: 850px) {
            .dashboard-container { flex-direction: row; justify-content: center; gap: 100px; align-items: flex-start; }
            .column { flex: 1; }
        }
    </style>
</head>
<body>

    <header>
        <h1>OSU INTEL FEED</h1>
        <p>Real-time throughput<br>and crowd analytics</p>
    </header>

    <div class="dashboard-container">
        <section class="column">
            <div class="column-header"><h2>Live Bars</h2></div>
            <div id="bars-list"></div>
        </section>

        <section class="column">
            <div class="column-header"><h2>Dining & Food</h2></div>
            <div id="food-list"></div>
        </section>
    </div>

    <div class="footer">
        © 2026 <a href="terms.html">Srikar Konda & Jackson Stevenson</a>. All rights reserved.
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="env.js"></script>

    <script>
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        const barOrder = { "Sky": 1, "Ethyl & Tank": 2, "Midway": 3, "Big Bar": 4, "Threes Above High": 5, "Library Bar": 6, "The Little Bar": 8, "Standard": 9 };
        const foodOrder = { "Raising Cane’s": 1, "Buckeye Donuts": 2, "McDonald's": 3, "Taco Bell": 4, "Apollo’s Greek Kitchen": 5, "Adriatico’s Pizza": 6, "Insomnia Cookies": 7, "Mikey's Late Night Slice": 8 };

        function getStatusColor(mins) {
            if (mins <= 10) return "var(--wait-green)";
            if (mins <= 30) return "var(--wait-yellow)";
            return "var(--wait-red)";
        }

        function getFillPercentage(mins) {
            if (mins <= 10) return (mins / 10) * 25;
            if (mins <= 30) return 25 + ((mins - 10) / 20) * 50;
            return Math.min(100, 75 + ((mins - 30) / 60) * 25);
        }

        function syncRefinery(collectionName, elementId, orderMap) {
            db.collection("universities").doc("ohio-state").collection(collectionName)
                .onSnapshot((querySnapshot) => {
                    const listElement = document.getElementById(elementId);
                    let venues = [];
                    querySnapshot.forEach(doc => venues.push({ id: doc.id, ...doc.data() }));
                    venues.sort((a, b) => (orderMap[a.name] || 99) - (orderMap[b.name] || 99));

                    listElement.innerHTML = ""; 
                    venues.forEach((data) => {
                        const wait = data.wait_time || 0;
                        const reports = data.verified_reports || 0;
                        const row = document.createElement("div");
                        row.className = "row-item";
                        row.innerHTML = `
                            <div class="row-top">
                                <div class="venue-info">
                                    <div class="venue-name">${data.name}</div>
                                    <div class="verified-reports">${reports} VERIFIED REPORTS</div>
                                </div>
                                <div class="wait-time-text">${wait} min</div>
                            </div>
                            <div class="bar-container">
                                <div class="bar-fill" style="width: ${getFillPercentage(wait)}%; background-color: ${getStatusColor(wait)};"></div>
                            </div>
                            <div class="vouch-section">
                                <button class="vouch-btn" onclick="vouch('${data.id}', ${wait})">✓ Vouch</button>
                                <div class="intel-options">
                                    <button onclick="reportIntel('${data.id}', 0)">0m</button>
                                    <button onclick="reportIntel('${data.id}', 5)">5m</button>
                                    <button onclick="reportIntel('${data.id}', 15)">15m</button>
                                    <button onclick="reportIntel('${data.id}', 30)">30m</button>
                                    <button onclick="reportIntel('${data.id}', 45)">45m+</button>
                                </div>
                            </div>
                        `;
                        listElement.appendChild(row);
                    });
                });
        }

        // Logic Change: This only reports to the feed, letting Gemini decide the live time [cite: 2026-01-25]
        window.reportIntel = function(docId, newTime) {
            db.collection("reports").add({
                bar_id: docId,
                wait_time: newTime,
                timestamp: firebase.firestore.FieldValue.serverTimestamp(),
                user_id: "AnonymousBuckeye"
            }).then(() => {
                console.log("Intel sent. Gemini is verifying...");
            });
        };

        window.vouch = function(docId, currentTime) {
            db.collection("reports").add({
                bar_id: docId,
                wait_time: currentTime,
                timestamp: firebase.firestore.FieldValue.serverTimestamp(),
                user_id: "AnonymousBuckeye",
                type: "vouch"
            });
        };

        syncRefinery("bars", "bars-list", barOrder);
        syncRefinery("food-joints", "food-list", foodOrder);
    </script>
</body>
</html>
