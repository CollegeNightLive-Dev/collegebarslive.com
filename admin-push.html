<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nyte Admin Push</title>
  <style>
    :root {
      --bg: #000;
      --card: #1c1c1e;
      --border: #2c2c2e;
      --text: #fff;
      --dim: #8e8e93;
      --ok: #2ecc71;
      --warn: #ff453a;
    }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      padding: 24px;
    }
    .wrap {
      width: 100%;
      max-width: 640px;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 14px;
    }
    h1 {
      margin: 0 0 14px;
      font-size: 22px;
    }
    label {
      display: block;
      font-size: 12px;
      color: var(--dim);
      margin: 10px 0 6px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }
    input, textarea, select, button {
      width: 100%;
      box-sizing: border-box;
      background: #111;
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 12px;
      font-size: 14px;
    }
    textarea { min-height: 84px; resize: vertical; }
    button { cursor: pointer; font-weight: 700; }
    .hint { color: var(--dim); font-size: 12px; margin-top: 8px; }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .hidden { display: none; }
    .status { white-space: pre-wrap; font-size: 13px; }
    .ok { color: var(--ok); }
    .err { color: var(--warn); }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <h1>Nyte Admin Push</h1>
      <label>Admin Secret</label>
      <input id="adminSecret" type="password" placeholder="ADMIN_PUSH_SECRET" />
      <label>Target</label>
      <select id="targetType">
        <option value="school">Send to School</option>
        <option value="uid">Send to One User UID</option>
      </select>
      <div id="schoolWrap">
        <label>School ID</label>
        <input id="schoolId" placeholder="ohio-state" />
      </div>
      <div id="uidWrap" class="hidden">
        <label>User UID</label>
        <input id="targetUid" placeholder="Firebase uid" />
      </div>
    </div>

    <div class="card">
      <label>Template</label>
      <select id="template">
        <option value="wait">Wait Time</option>
        <option value="deal">Deal</option>
        <option value="custom">Custom</option>
      </select>

      <div id="waitFields">
        <label>Bar Name</label>
        <input id="waitBarName" placeholder="Out-R-Inn" />
        <label>Wait Minutes</label>
        <input id="waitMinutes" placeholder="22" type="number" min="0" />
      </div>

      <div id="dealFields" class="hidden">
        <label>Bar Name</label>
        <input id="dealBarName" placeholder="Midway" />
        <label>Deal Text</label>
        <input id="dealText" placeholder="$3 wells" />
        <label>Deal End Time</label>
        <input id="dealUntil" placeholder="11:00 PM" />
      </div>

      <div id="customFields" class="hidden">
        <label>Title</label>
        <input id="customTitle" placeholder="Nyte Alert" />
        <label>Body</label>
        <textarea id="customBody" placeholder="Message body"></textarea>
      </div>

      <button id="sendBtn" type="button">Send Push</button>
      <div class="hint">Function: <code>sendAdminPush</code> (us-central1)</div>
    </div>

    <div class="card">
      <label>Status</label>
      <div id="status" class="status">Waiting to send…</div>
    </div>
  </div>

  <script>
    const targetTypeEl = document.getElementById("targetType");
    const schoolWrapEl = document.getElementById("schoolWrap");
    const uidWrapEl = document.getElementById("uidWrap");
    const templateEl = document.getElementById("template");
    const waitFieldsEl = document.getElementById("waitFields");
    const dealFieldsEl = document.getElementById("dealFields");
    const customFieldsEl = document.getElementById("customFields");
    const sendBtnEl = document.getElementById("sendBtn");
    const statusEl = document.getElementById("status");

    const callableUrl = "https://us-central1-college-bars-live.cloudfunctions.net/sendAdminPush";

    function setStatus(text, ok) {
      statusEl.textContent = text;
      statusEl.className = "status " + (ok ? "ok" : "err");
    }

    targetTypeEl.addEventListener("change", () => {
      const t = targetTypeEl.value;
      schoolWrapEl.classList.toggle("hidden", t !== "school");
      uidWrapEl.classList.toggle("hidden", t !== "uid");
    });

    templateEl.addEventListener("change", () => {
      const t = templateEl.value;
      waitFieldsEl.classList.toggle("hidden", t !== "wait");
      dealFieldsEl.classList.toggle("hidden", t !== "deal");
      customFieldsEl.classList.toggle("hidden", t !== "custom");
    });

    function buildPayload() {
      const adminSecret = document.getElementById("adminSecret").value.trim();
      const targetType = targetTypeEl.value;
      const schoolId = document.getElementById("schoolId").value.trim();
      const targetUid = document.getElementById("targetUid").value.trim();
      const template = templateEl.value;

      if (!adminSecret) throw new Error("Admin secret is required.");
      if (targetType === "school" && !schoolId) throw new Error("School ID is required.");
      if (targetType === "uid" && !targetUid) throw new Error("Target UID is required.");

      let title = "";
      let body = "";
      let data = {};

      if (template === "wait") {
        const barName = document.getElementById("waitBarName").value.trim();
        const waitMinutes = Number(document.getElementById("waitMinutes").value);
        if (!barName || !Number.isFinite(waitMinutes)) throw new Error("Wait template needs bar name and minutes.");
        title = "Wait Time Update";
        body = "The wait time at " + barName + " is now " + waitMinutes + " min.";
        data = { type: "wait_time", barName, waitMinutes };
      } else if (template === "deal") {
        const barName = document.getElementById("dealBarName").value.trim();
        const dealText = document.getElementById("dealText").value.trim();
        const dealUntil = document.getElementById("dealUntil").value.trim();
        if (!barName || !dealText || !dealUntil) throw new Error("Deal template needs bar, deal text, and end time.");
        title = "Deal Live at " + barName;
        body = dealText + " until " + dealUntil + ".";
        data = { type: "deal", barName, dealText, dealUntil };
      } else {
        title = document.getElementById("customTitle").value.trim();
        body = document.getElementById("customBody").value.trim();
        if (!title || !body) throw new Error("Custom template needs title and body.");
        data = { type: "custom" };
      }

      return {
        adminSecret,
        schoolId: targetType === "school" ? schoolId : null,
        targetUid: targetType === "uid" ? targetUid : null,
        title,
        body,
        data,
      };
    }

    sendBtnEl.addEventListener("click", async () => {
      try {
        const payload = buildPayload();
        setStatus("Sending…", true);
        sendBtnEl.disabled = true;
        const res = await fetch(callableUrl, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ data: payload }),
        });
        const json = await res.json();
        if (!res.ok || json.error) {
          const msg = (json.error && json.error.message) ? json.error.message : ("HTTP " + res.status);
          throw new Error(msg);
        }
        const result = json.result || {};
        setStatus(
          "Sent successfully.\nAttempted: " + (result.attempted || 0) +
          "\nTickets: " + (result.ticketCount || 0) +
          "\nPruned tokens: " + (result.prunedTokenCount || 0),
          true
        );
      } catch (err) {
        setStatus("Send failed: " + (err && err.message ? err.message : String(err)), false);
      } finally {
        sendBtnEl.disabled = false;
      }
    });
  </script>
</body>
</html>
